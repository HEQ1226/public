# ============================================================
#  HEQ 引导页 + 多服务反代配置示例
#  用途:同一台服务器上,引导页(静态站)与多个前后端分离的
#        服务(各占不同端口)共用一个域名,通过 nginx 反代暴露。
#
#  使用步骤:
#   1. 替换下方 server_name、ssl 证书路径、root 为你的实际值
#   2. 把本文件内容并入你的 nginx 配置(或 include 进来)
#   3. 校验并重载:  nginx -t && nginx -s reload
#
#  新增一个服务的标准操作(3 步):
#   - 复制下方「服务示例」段,改 3 处:路径名 / 前端端口 / 后端端口
#   - 在 services.config.js 里加一项,targetUrl 填 https://域名/路径名
#   - nginx -s reload
# ============================================================

# 80 端口:强制跳转 https
server {
    listen 80;
    server_name 638rember.me;        # ← 换成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 638rember.me;        # ← 换成你的域名

    # ↓↓↓ 换成你的证书实际路径(Let's Encrypt 示例) ↓↓↓
    ssl_certificate     /etc/letsencrypt/live/638rember.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/638rember.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---------- 引导页本身(静态站) ----------
    location / {
        root /path/to/HeqProjects;    # ← 换成项目实际绝对路径
        try_files $uri $uri/ /index.html;
    }

    # ================= 服务示例:博客 =================
    # 前端页面(跑在 :3000)
    location /blog/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 后端 API(跑在 :3001)
    location /blog-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ================= 服务示例:相册 =================
    location /gallery/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /gallery-api/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 新增服务:复制上面任一段,改路径名 + 端口即可 =====

    # ---------- 可选:WebSocket / 长连接支持 ----------
    # 若某服务前端用了 WebSocket,在其 location 内加:
    #   proxy_http_version 1.1;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
}

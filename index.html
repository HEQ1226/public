<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEQ Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

    * { font-family: 'Space Grotesk', sans-serif; }

    body {
      background: linear-gradient(145deg, #f8fbff 0%, #eef4ff 45%, #f5f2ff 100%);
      color: #0f172a;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.06) 0%, transparent 35%, transparent 65%, rgba(139, 92, 246, 0.05) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .gradient-text {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #06b6d4 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 200%;
      animation: gradient-shift 5s ease infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .glow-card {
      position: relative;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.32);
      box-shadow: 0 12px 36px rgba(37, 99, 235, 0.08);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .glow-card::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
      border-radius: inherit;
      opacity: 0;
      z-index: -1;
      filter: blur(25px);
      transition: opacity 0.4s ease;
    }

    .glow-card:hover::before { opacity: 1; }

    .glow-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(96, 165, 250, 0.5);
      box-shadow: 0 18px 45px rgba(96, 165, 250, 0.28);
    }

    .glow-card:hover .card-arrow { transform: translateX(4px); opacity: 1; }
    .glow-card:hover .card-icon { transform: scale(1.12) rotate(6deg); }

    .card-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      transition: transform 0.4s ease;
      flex-shrink: 0;
    }

    .card-icon.blue   { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .card-icon.indigo { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); }
    .card-icon.violet { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); }

    .card-arrow {
      opacity: 0.5;
      transition: transform 0.3s ease, opacity 0.3s ease;
      color: #6366f1;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(148,163,184,0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148,163,184,0.14) 1px, transparent 1px);
      background-size: 120px 120px;
      pointer-events: none;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.15));
    }

    .status-dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.4); }
    }

    .glass-header {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(148,163,184,0.3);
      box-shadow: 0 10px 28px rgba(30, 64, 175, 0.08);
    }

    .nav-link { color: #475569; font-weight: 600; font-size: 0.95rem; transition: color 0.25s ease; }
    .nav-link:hover { color: #2563eb; }

    .primary-btn {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #06b6d4 100%);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.28);
    }
    .primary-btn:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 18px 40px rgba(124, 58, 237, 0.3); }

    .soft-chip {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.15));
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: #334155;
    }

    .ambient-glow {
      position: fixed;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(70px);
      opacity: 0.45;
      z-index: 0;
    }
    .ambient-glow-1 { width: 380px; height: 380px; top: 8%; left: -90px; background: radial-gradient(circle, rgba(59,130,246,0.32) 0%, rgba(59,130,246,0) 72%); }
    .ambient-glow-2 { width: 420px; height: 420px; bottom: 4%; right: -120px; background: radial-gradient(circle, rgba(168,85,247,0.26) 0%, rgba(168,85,247,0) 72%); }

    /* ===== 交互特效：粒子跟随 / 点击涟漪 / 背景光球斥力 ===== */
    .cursor-dot {
      position: fixed;
      top: 0; left: 0;
      width: 10px; height: 10px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(124,58,237,0.9) 0%, rgba(124,58,237,0) 70%);
      box-shadow: 0 0 12px 2px rgba(124,58,237,0.45);
      pointer-events: none;
      z-index: 42;
      will-change: transform;
    }

    .click-ripple {
      position: fixed;
      width: 16px; height: 16px;
      border-radius: 999px;
      border: 2px solid rgba(99, 102, 241, 0.55);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      z-index: 45;
      animation: click-ripple-anim 0.6s cubic-bezier(0.2, 0.6, 0.2, 1) forwards;
    }
    @keyframes click-ripple-anim {
      0%   { transform: translate(-50%, -50%) scale(1);  opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(17); opacity: 0; border-width: 0.4px; }
    }

    .click-particle {
      position: fixed;
      width: 7px; height: 7px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 45;
      box-shadow: 0 0 8px 1px rgba(129,140,248,0.6);
      animation: click-particle-anim 0.7s ease-out forwards;
    }
    @keyframes click-particle-anim {
      0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.2); opacity: 0; }
    }

    @media (hover: none) {
      .cursor-dot { display: none; }
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .empty-hint {
      text-align: center;
      color: #64748b;
      padding: 3rem 1rem;
      border: 1px dashed rgba(148, 163, 184, 0.5);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 640px) {
      .service-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="min-h-screen text-slate-900 relative">

  <div class="ambient-glow ambient-glow-2"></div>
  <div class="grid-overlay"></div>

  <!-- 导航栏 -->
  <header class="glass-header fixed top-0 left-0 right-0 z-50">

          <span class="text-white font-bold text-xl">H</span>
        </div>
        <div>
          <span class="font-bold text-xl">HEQ</span>

      </div>
      <nav class="hidden md:flex items-center gap-8">

        <a href="#services" class="nav-link">服务</a>
        <a href="#about" class="nav-link">关于</a>

        <span class="text-sm text-gray-500">所有系统正常运行</span>
      </div>
    </div>
  </header>

  <!-- Hero 区域 -->
  <section id="home" class="min-h-screen flex items-center justify-center px-6 pt-24 pb-14 relative">
    <div class="max-w-3xl mx-auto relative z-10 text-center">
      <div class="hero-panel rounded-3xl px-6 py-12 md:px-12 md:py-16" style="background: linear-gradient(135deg, rgba(255,255,255,0.82), rgba(255,255,255,0.6)); border: 1px solid rgba(148,163,184,0.35); box-shadow: 0 20px 50px rgba(59,130,246,0.12);">
        <p class="text-sm md:text-base text-slate-600 bg-white/65 border border-slate-300/60 rounded-2xl px-4 py-3 mb-6">
          本页面为个人非商用导航页，仅用于个人作品与服务的跳转，不提供任何经营性平台服务。
        </p>

        <div class="inline-flex items-center gap-2 bg-gradient-to-r from-[#38bdf8]/20 to-[#818cf8]/20 border border-[#38bdf8]/30 rounded-full px-6 py-2 mb-10">
          <svg class="w-5 h-5 text-[#38bdf8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span class="text-sm font-medium text-[#38bdf8]">欢迎访问我的主页</span>
        </div>

        <h1 class="text-6xl md:text-8xl font-bold mb-8 leading-none">
          <span class="gradient-text">我的主页</span>
        </h1>

        <p class="text-xl md:text-2xl text-gray-500 mb-4 max-w-2xl mx-auto leading-relaxed">
          探索无限可能，连接你的数字世界
        </p>
        <p class="text-gray-400 mb-10 max-w-xl mx-auto">
          下面是我正在使用的服务与作品，点击卡片即可直达。
        </p>

        <a href="#services" class="primary-btn inline-flex items-center justify-center gap-2 text-white font-bold px-7 py-3 rounded-xl">
          浏览服务
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </a>
      </div>
    </div>
  </section>

  <div class="divider max-w-4xl mx-auto" style="position: relative; height: 2px; background: linear-gradient(90deg, transparent, rgba(148,163,184,0.4), transparent); overflow: hidden;">
    <div style="position:absolute; width:100%; height:100%; background: linear-gradient(90deg, transparent, #60a5fa, #a78bfa, #22d3ee, transparent); animation: divider-flow 4s linear infinite;"></div>
  </div>

  <!-- 服务卡片区域 -->
  <section id="services" class="py-24 px-6 relative z-10">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-12 relative">
        <span class="text-sm font-bold text-[#818cf8] tracking-widest uppercase">Services</span>
        <h2 class="text-4xl md:text-6xl font-bold mt-4 gradient-text">作品与服务</h2>
      </div>

      <div id="serviceGrid" class="service-grid"></div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer id="about" class="border-t border-slate-300/60 py-12 relative z-10">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-gradient-to-br from-[#38bdf8] to-[#818cf8] rounded-lg flex items-center justify-center">
            <span class="text-white font-bold text-sm">H</span>
          </div>
          <span class="font-medium">HEQ Services</span>
        </div>
        <div class="text-gray-500 text-sm">© 2026 All rights reserved. Built with ❤️</div>
        <div class="flex items-center gap-4">
          <a href="https://github.com/HEQ1226" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-slate-700 transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </a>
        </div>
      </div>
      <div class="mt-6 text-center text-xs text-slate-500">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="hover:text-slate-700 transition-colors">
          湘ICP备2026008871号
        </a>
      </div>
    </div>
  </footer>

  <!-- 静态配置：服务列表写在 services.config.js 中 -->
  <script src="./services.config.js"></script>
  <script>
    const services = Array.isArray(window.HEQ_SERVICES) ? window.HEQ_SERVICES : [];
    const grid = document.getElementById("serviceGrid");

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderServices() {
      if (!services.length) {
        grid.innerHTML = '<div class="empty-hint">还没有配置任何服务。<br>编辑 <code>services.config.js</code> 添加你的第一个服务吧。</div>';
        return;
      }

      grid.innerHTML = services.map((service) => {
        const tone = ["blue", "indigo", "violet"].includes(service.tone) ? service.tone : "indigo";
        const icon = service.icon || (service.name ? service.name.trim().charAt(0) : "•");
        const tag = service.tag
          ? `<span class="soft-chip text-xs font-semibold rounded-full px-3 py-1">${escapeHtml(service.tag)}</span>`
          : "";
        const link = `./gateway.html?service=${encodeURIComponent(service.slug)}`;
        return `
          <a class="glow-card rounded-2xl p-5" href="${link}" target="_blank" rel="noopener noreferrer">
            <div class="flex items-start gap-4">
              <div class="card-icon ${tone}">${escapeHtml(icon)}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                  <h3 class="font-bold text-lg text-slate-800 truncate">${escapeHtml(service.name)}</h3>
                  <svg class="card-arrow w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                  </svg>
                </div>
                <p class="text-sm text-gray-500 mt-1 leading-relaxed">${escapeHtml(service.description)}</p>
                <div class="mt-3">${tag}</div>
              </div>
            </div>
          </a>
        `;
      }).join("");
    }

    renderServices();

    /* ===== 粒子跟手 / 点击涟漪 / 背景光球被鼠标推开后恢复 ===== */
    (function () {
      const dot = document.querySelector(".cursor-dot");

      // 背景光球：鼠标滑过时将其推开，停止滑动约 1.2s 后平滑恢复
      const blobs = [".ambient-glow-1", ".ambient-glow-2"]
        .map(function (sel) { return document.querySelector(sel); })
        .filter(Boolean)
        .map(function (el, i) {
          return { el: el, bx: 0, by: 0, ox: 0, oy: 0, tx: 0, ty: 0, phase: i * 1.7 };
        });
      function measure() {
        blobs.forEach(function (b) {
          const r = b.el.getBoundingClientRect();
          b.bx = r.left + r.width / 2;
          b.by = r.top + r.height / 2;
        });
      }
      measure();
      window.addEventListener("resize", measure);

      let mx = window.innerWidth / 2;
      let my = window.innerHeight / 2;
      let dx = mx, dy = my;
      let lastMove = -9999;

      window.addEventListener("mousemove", function (e) {
        mx = e.clientX;
        my = e.clientY;
        lastMove = performance.now();
      }, { passive: true });

      const RADIUS = 300;   // 鼠标影响范围(px)
      const MAX_PUSH = 110; // 最大推开距离(px)
      const RECOVER = 1200; // 停止滑动多久后开始恢复(ms)

      function loop() {
        const now = performance.now();
        const idle = (now - lastMove) > RECOVER;

        // 粒子光点：高跟随系数，几乎跟手
        dx += (mx - dx) * 0.6;
        dy += (my - dy) * 0.6;
        if (dot) dot.style.transform = "translate(" + dx + "px, " + dy + "px) translate(-50%, -50%)";

        // 背景光球：靠得近就被推开，停下后恢复
        blobs.forEach(function (b) {
          if (!idle) {
            const ddx = b.bx - mx, ddy = b.by - my;
            const dist = Math.hypot(ddx, ddy);
            if (dist < RADIUS && dist > 1) {
              const force = (1 - dist / RADIUS) * MAX_PUSH;
              b.tx = (ddx / dist) * force;
              b.ty = (ddy / dist) * force;
            } else { b.tx = 0; b.ty = 0; }
          } else { b.tx = 0; b.ty = 0; }
          b.ox += (b.tx - b.ox) * 0.08;
          b.oy += (b.ty - b.oy) * 0.08;
          b.phase += 0.006;
          const fx = Math.sin(b.phase) * 24;
          const fy = Math.cos(b.phase * 0.8) * 20;
          b.el.style.transform = "translate(" + (b.ox + fx) + "px, " + (b.oy + fy) + "px)";
        });

        requestAnimationFrame(loop);
      }
      loop();

      const palette = ["#38bdf8", "#818cf8", "#c084fc", "#22d3ee", "#a78bfa"];
      window.addEventListener("pointerdown", function (e) {
        const ripple = document.createElement("div");
        ripple.className = "click-ripple";
        ripple.style.left = e.clientX + "px";
        ripple.style.top = e.clientY + "px";
        document.body.appendChild(ripple);
        ripple.addEventListener("animationend", function () { ripple.remove(); });

        const count = 10;
        for (let i = 0; i < count; i++) {
          const p = document.createElement("div");
          p.className = "click-particle";
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.6;
          const dist = 36 + Math.random() * 54;
          p.style.left = e.clientX + "px";
          p.style.top = e.clientY + "px";
          p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          p.style.setProperty("--ty", Math.sin(angle) * dist + "px");
          p.style.background = palette[Math.floor(Math.random() * palette.length)];
          document.body.appendChild(p);
          p.addEventListener("animationend", function () { p.remove(); });
        }
      });
    })();
  </script>
</body>
</html>

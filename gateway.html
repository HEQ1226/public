<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEQ Gateway</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f8fbff 0%, #eef4ff 45%, #f5f2ff 100%);
      color: #0f172a;
      padding: 1rem;
    }

    .panel {
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 20px;
      box-shadow: 0 20px 48px rgba(30, 64, 175, 0.12);
      padding: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #334155;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.18);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
    }

    h1 {
      margin-top: 0.9rem;
      font-size: 1.35rem;
      line-height: 1.4;
      font-weight: 700;
      color: #0f172a;
    }

    p {
      margin-top: 0.65rem;
      color: #475569;
      line-height: 1.65;
      font-size: 0.95rem;
    }

    .meta {
      margin-top: 1rem;
      padding: 0.8rem 0.9rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.88rem;
      color: #334155;
      word-break: break-all;
    }

    .actions {
      margin-top: 1.2rem;
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 0.58rem 0.95rem;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #06b6d4 100%);
      color: #ffffff;
    }

    .btn-secondary {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 0.4rem;
      border: 2px solid rgba(37, 99, 235, 0.25);
      border-top-color: #2563eb;
      border-radius: 999px;
      animation: spin 0.8s linear infinite;
      vertical-align: -2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="panel">
    <span class="badge">Gateway · 服务路由</span>
    <h1 id="title">正在解析网关服务...</h1>
    <p id="desc">请稍候，系统正在根据服务编码匹配目标服务。</p>
    <div class="meta" id="meta">service: -</div>
    <div class="actions" id="actions" style="display:none;">
      <a href="./index.html" class="btn btn-secondary">返回引导页</a>
    </div>
  </main>

  <!-- 静态配置：服务列表写在 services.config.js 中，无需后端 -->
  <script src="./services.config.js"></script>
  <script>
    const services = Array.isArray(window.HEQ_SERVICES) ? window.HEQ_SERVICES : [];

    function getServiceCodeFromUrl() {
      const url = new URL(window.location.href);
      return (url.searchParams.get("service") || "").trim();
    }

    function isSafeTargetUrl(targetUrl) {
      try {
        const parsed = new URL(targetUrl);
        return ["http:", "https:"].includes(parsed.protocol);
      } catch (_) {
        return false;
      }
    }

    function setMessage(title, desc, meta) {
      document.getElementById("title").textContent = title;
      document.getElementById("desc").textContent = desc;
      document.getElementById("meta").textContent = meta;
    }

    function showBack() {
      document.getElementById("actions").style.display = "flex";
    }

    function runGateway() {
      const serviceCode = getServiceCodeFromUrl();
      if (!serviceCode) {
        setMessage(
          "缺少服务编码参数",
          "请从引导页点击服务入口访问，或在地址上补充 ?service=xxx 参数。",
          "service: 未提供"
        );
        showBack();
        return;
      }

      if (!/^[a-z0-9-]{2,32}$/.test(serviceCode)) {
        setMessage(
          "服务编码格式不合法",
          "编码只允许小写字母、数字和连字符，长度 2-32。",
          `service: ${serviceCode}`
        );
        showBack();
        return;
      }

      const service = services.find((item) => item.slug === serviceCode);
      if (!service) {
        setMessage(
          "未找到对应服务",
          "请确认 services.config.js 中是否已配置该服务编码。",
          `service: ${serviceCode}`
        );
        showBack();
        return;
      }

      if (!isSafeTargetUrl(service.targetUrl)) {
        setMessage(
          "服务目标地址不可用",
          "当前服务的目标地址格式异常，请在 services.config.js 中修正。",
          `service: ${serviceCode} | target: ${service.targetUrl || "-"}`
        );
        showBack();
        return;
      }

      // 正常跳转：直接显示「正在跳转中」，不再展示返回 / 手动跳转按钮
      setMessage(
        "正在跳转中…",
        `正在为你打开「${service.name || serviceCode}」…`,
        `service: ${serviceCode} | target: ${service.targetUrl}`
      );

      window.setTimeout(() => {
        window.location.href = service.targetUrl;
      }, 900);
    }

    runGateway();
  </script>
</body>
</html>
